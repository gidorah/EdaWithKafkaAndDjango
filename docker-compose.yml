services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_KAFKA_CREATE_TOPICS=order-events:3:1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8080:8080"
    environment:
      - AKHQ_CONFIGURATION={"akhq":{"connections":{"local":{"properties":{"bootstrap.servers":"kafka:9092"}}}}}
      - JAVA_TOOL_OPTIONS=-Dlog4j2.formatMsgNoLookups=true
    depends_on:
      - kafka

  django:
    build: .
    ports:
      - "8000:8000"
      - "5679:5679"
    volumes:
      - .:/app
    depends_on:
      - kafka
    environment:
      - REMOTE_DEBUGGING_PORT=5679

  celery:
    build:
      context: .
    container_name: celery
    command: celery -A consumer worker --loglevel=info
    depends_on:
      - django
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app

  celery-beat:
    build:
      context: .
    container_name: celery-beat
    command: celery -A consumer beat --loglevel=info
    depends_on:
      - celery
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
